[workspace]
name = "mds5122-speech-prediction"
version = "0.1.0"
channels = ["nvidia/label/cuda-12.1.0", "nvidia", "pytorch", "conda-forge"]
platforms = ["linux-64"]
channel-priority = "disabled"

[tasks]
extract-encodec = "python scripts/extract_tokens.py --codec encodec --split all"
extract-facodec = "python scripts/extract_tokens.py --codec facodec --split all"
train-encodec   = "python src/train.py --config configs/encodec_lm.yaml"
train-facodec   = "python src/train.py --config configs/facodec_lm.yaml"
eval-encodec    = "python scripts/run_eval.py --config configs/encodec_lm.yaml"
eval-facodec    = "python scripts/run_eval.py --config configs/facodec_lm.yaml"

[dependencies]
python          = "3.10.*"
pytorch         = {version = "2.3.*", channel = "pytorch"}
torchvision     = {version = "0.18.*", channel = "pytorch"}
torchaudio      = {version = "2.3.*", channel = "pytorch"}
pytorch-cuda    = {version = "12.1.*", channel = "pytorch"}
numpy           = ">=1.24,<2"
einops          = ">=0.7"
tqdm            = ">=4.66"
pysoundfile     = ">=0.12"
pyyaml          = ">=6.0"
librosa         = ">=0.10"

[pypi-dependencies]
torchmetrics        = ">=1.3"
pesq                = ">=0.0.4"
pystoi              = ">=0.4"
encodec             = {path = "encodec", editable = true}
descript-audio-codec = ">=1.0"
munch               = ">=2.5"
accelerate          = ">=0.28"
transformers        = ">=4.38"
tensorboard         = ">=2.15"
